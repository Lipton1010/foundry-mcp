# Publishes a release when a version tag (v1.2.3) is pushed: the module manifest and a zip of the
# module folder, which is what Foundry's "Install Module" downloads through the manifest URL.
# The tag must match the version in foundry-mcp/module.json; `npm test` checks the rest agree.
# Nothing is published unless the whole test matrix (Linux and Windows, Node 20 and 24) and the
# dependency audit pass for the tagged commit.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the manifest
        run: |
          version=$(node -p "require('./foundry-mcp/module.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.json version $version" >&2
            exit 1
          fi
      - name: Package the module
        run: |
          cp LICENSE foundry-mcp/LICENSE
          (cd foundry-mcp && zip -r ../module.zip .)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Only the tag that was tested: it must still exist and still point at this commit.
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Tag $GITHUB_REF_NAME now points at $tagged, not the tested commit $GITHUB_SHA" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" module.zip foundry-mcp/module.json --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
